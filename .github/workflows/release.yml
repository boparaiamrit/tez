name: Release

# Push a tag like v0.2.0: build on Windows, macOS (Apple silicon) and Linux, run the smoke test on
# each, package, and attach everything to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libasound2-dev libssl-dev \
            libzstd-dev libdbus-1-dev pkg-config cmake clang jq

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew list jq >/dev/null 2>&1 || brew install jq

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test -p tez

      - name: Build
        run: cargo build --release --workspace

      - name: Smoke test (macOS and Linux)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/smoke.sh ./target/release/tez

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/smoke.ps1 ./target/release/tez.exe

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist\tez | Out-Null
          Copy-Item target\release\tez.exe, target\release\tez-app.exe, README.md dist\tez
          Compress-Archive -Path dist\tez\* -DestinationPath "tez-$v-${{ matrix.name }}.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          $ver = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'tez').version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$ver" "/DOutputName=tez-$v-${{ matrix.name }}-setup" packaging\windows\tez.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist\tez-$v-${{ matrix.name }}-setup.exe" .

      # Install without the set-up step, check tez runs and the Start menu entry exists, uninstall,
      # and check both are gone.
      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Item "tez-*-setup.exe"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=!setup', '/LOG=installer.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content installer.log -Tail 40; exit 1 }
          $bin = "$env:USERPROFILE\.tez\bin"
          & "$bin\tez.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$bin\tez-app.exe")) { 'tez-app.exe is missing'; exit 1 }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\tez.lnk"
          if (-not (Test-Path $lnk)) { 'the Start menu entry is missing'; exit 1 }
          $un = Get-ChildItem "$bin\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path "$bin\tez.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$bin\tez.exe") { 'uninstalling left tez.exe'; exit 1 }
          if (Test-Path $lnk) { 'uninstalling left the Start menu entry'; exit 1 }
          'installer: install, run and uninstall ok'

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          v="${GITHUB_REF_NAME}"
          app=dist/Tez.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/tez-app target/release/tez "$app/Contents/MacOS/"
          cp app/assets/icon/tez.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Tez</string>
            <key>CFBundleDisplayName</key><string>tez</string>
            <key>CFBundleIdentifier</key><string>dev.tez.app</string>
            <key>CFBundleExecutable</key><string>tez-app</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>${v#v}</string>
            <key>CFBundleVersion</key><string>${v#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$app"
          hdiutil create -volname Tez -srcfolder "$app" -ov -format UDZO "tez-$v-${{ matrix.name }}.dmg"
          tar -czf "tez-$v-${{ matrix.name }}-cli.tar.gz" -C target/release tez

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${GITHUB_REF_NAME}"
          mkdir -p dist/tez
          cp target/release/tez target/release/tez-app README.md dist/tez/
          cp app/assets/icon/tez.png dist/tez/tez.png
          # Icon=tez finds tez.png once it is copied to ~/.local/share/icons/hicolor/512x512/apps/.
          cp packaging/linux/tez.desktop dist/tez/tez.desktop
          tar -czf "tez-$v-${{ matrix.name }}.tar.gz" -C dist tez

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: deb and rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${GITHUB_REF_NAME}"
          cargo deb --no-build -o "tez-$v-${{ matrix.name }}.deb"
          cargo generate-rpm -o "tez-$v-${{ matrix.name }}.rpm"

      # The .deb on this Ubuntu runner, the .rpm in a Fedora container: install, run, remove.
      - name: Package test (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${GITHUB_REF_NAME}"
          sudo apt-get install -y "./tez-$v-${{ matrix.name }}.deb"
          /usr/bin/tez version
          test -x /usr/bin/tez-app
          test -f /usr/share/applications/tez.desktop
          dpkg -s tez | grep -E '^(Version|Depends):'
          sudo apt-get remove -y tez
          test ! -e /usr/bin/tez
          docker run --rm -v "$PWD:/w" fedora:41 bash -ec "
            dnf install -y -q /w/tez-$v-${{ matrix.name }}.rpm
            tez version
            test -x /usr/bin/tez-app
            rpm -q tez
            dnf remove -y -q tez
            test ! -e /usr/bin/tez"
          echo "deb and rpm: install, run and remove ok"

      # Every run keeps its packages for a while, so a run without a tag can be tried out too.
      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: tez-${{ matrix.name }}
          path: |
            tez-*.zip
            tez-*.dmg
            tez-*.tar.gz
            tez-*-setup.exe
            tez-*.deb
            tez-*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tez-*.zip
            tez-*.dmg
            tez-*.tar.gz
            tez-*-setup.exe
            tez-*.deb
            tez-*.rpm
          generate_release_notes: true
