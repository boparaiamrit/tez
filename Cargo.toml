[package]
name = "tez"
version = "0.2.5"
edition = "2024"
description = "A fast, native Laravel development environment for Windows: every PHP version, PostgreSQL with TimescaleDB, Redis, Meilisearch, Mailpit, S3 and Horizon, from one binary."
license = "MIT"
authors = ["Amritpal Singh"]

[workspace]
members = ["app"]

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dev-dependencies]
x509-parser = { version = "0.18.1", features = ["verify"] }
