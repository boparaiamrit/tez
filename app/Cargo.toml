[package]
name = "tez-app"
version = "0.1.0"
edition = "2024"
description = "The tez desktop app: a native GPUI Kit window and tray icon for the tez daemon."
license = "MIT"

[[bin]]
name = "tez-app"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26.1"
