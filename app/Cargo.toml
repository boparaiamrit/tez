[package]
name = "tez-app"
version = "0.2.7"
edition = "2024"
description = "The tez desktop app: a native GPUI Kit window and tray icon for the tez daemon."
license = "MIT"
authors = ["Amritpal Singh <boparaiamrit@gmail.com>"]
repository = "https://github.com/boparaiamrit/tez"

[[bin]]
name = "tez-app"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ksni: the Linux tray speaks StatusNotifierItem over D-Bus itself, so no GTK event loop is needed.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[build-dependencies]
winresource = "0.1.34"
